<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>404 — Abhyudh Solanki</title>
    <meta name="description" content="That page does not exist." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    <meta name="theme-color" content="#131211" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <style>
      /* Standalone by design: no JS, no app bundle, no React. A 404 that has
         to boot a 400kb SPA to tell you the page is missing is a worse 404.
         The tokens below are the same values as src/styles/tokens.css. */
      :root {
        --void: #131211;
        --chalk: #f1ede5;
        --chalk-60: rgba(241, 237, 229, 0.6);
        --chalk-35: rgba(241, 237, 229, 0.56);
        --chalk-15: rgba(241, 237, 229, 0.15);
        --acid: #c8f751;
        --font-display: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        --gutter: clamp(1.15rem, 4.2vw, 4.5rem);
        color-scheme: dark;
      }

      * { box-sizing: border-box; margin: 0; }

      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 4rem;
        padding: clamp(1.5rem, 5vh, 3.5rem) var(--gutter);
        background: var(--void);
        color: var(--chalk);
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--chalk-35);
      }

      .code {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(5rem, 26vw, 20rem);
        line-height: 0.84;
        letter-spacing: -0.035em;
        color: transparent;
        -webkit-text-stroke: 2px var(--chalk-15);
      }

      h1 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(2.5rem, 7.5vw, 6.5rem);
        line-height: 0.84;
        letter-spacing: -0.035em;
        text-transform: lowercase;
        max-width: 14ch;
        margin-top: 0.25em;
      }

      .accent { color: var(--acid); }

      p {
        margin-top: 1.5rem;
        max-width: 46ch;
        font-family: var(--font-mono);
        font-size: 0.875rem;
        line-height: 1.7;
        color: var(--chalk-60);
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 0.6em;
        margin-top: 2.5rem;
        padding: 0.7em 1.4em 0.75em;
        border: 1px solid var(--chalk-15);
        border-radius: 999px 999px 999px 4px;
        color: var(--chalk);
        text-decoration: none;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: border-color 180ms, color 180ms, gap 180ms;
      }

      .back:hover,
      .back:focus-visible { border-color: var(--acid); color: var(--acid); gap: 0.9em; }

      :focus-visible { outline: 2px solid var(--acid); outline-offset: 3px; }

      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="meta">
      <span>Abhyudh Solanki</span>
      <span>Error 404</span>
    </div>

    <main>
      <span class="code" aria-hidden="true">404</span>
      <h1>this one <span class="accent">did not ship.</span></h1>
      <p>
        There is nothing at this address. Either it moved, or it never existed —
        both happen around here more often than I would like to admit.
      </p>
      <a class="back" href="/">
        Back to the work <span aria-hidden="true">&#8599;</span>
      </a>
    </main>

    <div class="meta">
      <span>India</span>
      <span>Build it, then argue about it.</span>
    </div>
  </body>
</html>
